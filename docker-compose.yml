services:
  api:
    build:
      context: .
      dockerfile: TodoApi.API/Dockerfile
    container_name: todo_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017/?replicaSet=rs0
      - MongoDbSettings__DatabaseName=TodoDb
      - MongoDbSettings__TodoItemsCollectionName=TodoItems
      - MongoDbSettings__TodoTagsCollectionName=TodoTags
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: todo_mongodb
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0
    container_name: todo_mongo_init
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})'
      "

volumes:
  mongo_data:
