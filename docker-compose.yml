services:
  mongodb:
    image: mongo:7.0
    container_name: todo_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: TodoDb
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
